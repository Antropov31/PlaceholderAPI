name: Release

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build shaded jar
        run: ./gradlew shadowJar -DBUILD_NUMBER=${{ github.run_number }}

      - name: Locate jar
        id: jar
        run: |
          JAR=$(ls build/libs/PlaceholderAPI-*.jar | grep -v -E '\-(sources|javadoc|plain)\.jar$' | head -n 1)
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$JAR")" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlaceholderAPINot
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.12.3-build.${{ github.run_number }}
          name: PlaceholderAPINot v2.12.3 (build ${{ github.run_number }})
          files: ${{ steps.jar.outputs.path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
